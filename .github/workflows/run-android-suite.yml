name: Run Android Suite

on:
  workflow_call:
    inputs:
      suite_name:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      timeout_minutes:
        required: false
        type: number
        default: 40

permissions:
  contents: write

jobs:
  static-validation:
    name: Static Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  android-smoke:
    name: ${{ inputs.suite_name }}
    needs: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      CI: true
      APPIUM_HOST: 127.0.0.1
      APPIUM_PORT: 4723
      APPIUM_PATH: /
      APPIUM_COMMAND: appium
      APPIUM_MANAGED_SERVICE: true
      ANDROID_AUTOMATION_NAME: UiAutomator2
      ANDROID_DEVICE_NAME: emulator-5554
      ANDROID_UDID: emulator-5554
      ANDROID_APP_PATH: apps/android/wdio-demo-app.apk
      ANDROID_APP_PACKAGE: com.wdiodemoapp
      ANDROID_APP_ACTIVITY: com.wdiodemoapp.MainActivity
      ANDROID_APP_WAIT_ACTIVITY: com.wdiodemoapp.MainActivity
      ANDROID_NO_RESET: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Download latest WebdriverIO demo APK
        shell: bash
        run: |
          mkdir -p apps/android
          python - <<'PY'
          import json
          import pathlib
          import urllib.request

          api_url = "https://api.github.com/repos/webdriverio/native-demo-app/releases/latest"
          with urllib.request.urlopen(api_url) as response:
              release = json.load(response)

          apk_url = next(
              asset["browser_download_url"]
              for asset in release["assets"]
              if asset["name"].endswith(".apk")
          )

          destination = pathlib.Path("apps/android/wdio-demo-app.apk")
          urllib.request.urlretrieve(apk_url, destination)
          print(f"Downloaded {apk_url} -> {destination}")
          PY

      - name: Run Android smoke scenario
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            test -f apps/android/wdio-demo-app.apk
            npx appium --version
            command -v adb
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 5; done
            mkdir -p artifacts/allure-results artifacts/appium-logs
            adb devices
            npx wdio run wdio.conf.ts --spec ./features/smoke.feature

      - name: Verify Allure raw results
        if: always() && hashFiles('artifacts/allure-results/**') != ''
        shell: bash
        run: |
          RESULT_COUNT=$(find artifacts/allure-results -maxdepth 1 -type f \( -name '*-result.json' -o -name '*-container.json' \) | wc -l)
          echo "Detected Allure result files: ${RESULT_COUNT}"

          if [ "${RESULT_COUNT}" -eq 0 ]; then
            echo "No Allure raw results were produced under artifacts/allure-results." >&2
            exit 1
          fi

      - name: Generate Allure report
        if: always() && hashFiles('artifacts/allure-results/**') != ''
        run: npm run allure:generate

      - name: Compute hosted report URL
        if: always() && hashFiles('artifacts/allure-report/**') != ''
        id: hosted_report
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            REPORT_PATH="reports/pr-${{ github.event.pull_request.number }}"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            REPORT_PATH="reports/nightly"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            REPORT_PATH="reports/main"
          else
            REPORT_PATH="reports/run-${{ github.run_id }}"
          fi

          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${REPORT_PATH}/"
          echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
          echo "report_url=$REPORT_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy hosted Allure report
        if: >
          always() &&
          hashFiles('artifacts/allure-report/**') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./artifacts/allure-report
          destination_dir: ${{ steps.hosted_report.outputs.report_path }}
          keep_files: true

      - name: Upload Allure report artifact
        if: always() && hashFiles('artifacts/allure-report/**') != ''
        id: upload_allure_report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-allure-report
          if-no-files-found: warn
          path: artifacts/allure-report/

      - name: Upload test artifacts
        if: always()
        id: upload_test_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          if-no-files-found: warn
          path: artifacts/

      - name: Add report links to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Allure Report"
            echo

            if [ -n "${{ steps.hosted_report.outputs.report_url }}" ] && [ "${{ github.event_name }}" != "pull_request" -o "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              echo "- Hosted report [here](${{ steps.hosted_report.outputs.report_url }})"
            elif [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "- Hosted report was skipped because the PR source does not have write permission to publish previews."
            fi

            if [ -n "${{ steps.upload_allure_report.outputs.artifact-url }}" ]; then
              echo "- Downloadable report artifact [here](${{ steps.upload_allure_report.outputs.artifact-url }})"
            else
              echo "- Report artifact was not generated for this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
