name: Nightly Smoke

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-smoke-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  smoke:
    name: Android Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      APPIUM_HOST: 127.0.0.1
      APPIUM_PORT: 4723
      APPIUM_PATH: /
      APPIUM_COMMAND: appium
      APPIUM_MANAGED_SERVICE: true
      ANDROID_AUTOMATION_NAME: UiAutomator2
      ANDROID_DEVICE_NAME: Android Emulator
      ANDROID_APP_PATH: apps/android/wdio-demo-app.apk
      ANDROID_APP_PACKAGE: com.wdiodemoapp
      ANDROID_APP_ACTIVITY: com.wdiodemoapp.MainActivity
      ANDROID_APP_WAIT_ACTIVITY: com.wdiodemoapp.MainActivity
      ANDROID_NO_RESET: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download latest WebdriverIO demo APK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apps/android
          python - <<'PY'
          import json
          import pathlib
          import urllib.request
          import os

          api_url = "https://api.github.com/repos/webdriverio/native-demo-app/releases/latest"
          request = urllib.request.Request(
              api_url,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              release = json.load(response)

          apk_url = next(
              asset["browser_download_url"]
              for asset in release["assets"]
              if asset["name"].endswith(".apk")
          )

          destination = pathlib.Path("apps/android/wdio-demo-app.apk")
          urllib.request.urlretrieve(apk_url, destination)
          print(f"Downloaded {apk_url} -> {destination}")
          PY

      - name: Run Android smoke scenario
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 5; done
            mkdir -p artifacts/allure-results artifacts/appium-logs
            adb devices
            npx wdio run wdio.conf.ts --spec ./features/smoke.feature

      - name: Verify Allure raw results
        if: always() && hashFiles('artifacts/allure-results/**') != ''
        shell: bash
        run: |
          RESULT_COUNT=$(find artifacts/allure-results -maxdepth 1 -type f \( -name '*-result.json' -o -name '*-container.json' \) | wc -l)
          echo "Detected Allure result files: ${RESULT_COUNT}"

          if [ "${RESULT_COUNT}" -eq 0 ]; then
            echo "No Allure raw results were produced under artifacts/allure-results." >&2
            exit 1
          fi

      - name: Generate Allure report
        if: always() && hashFiles('artifacts/allure-results/**') != ''
        run: npm run allure:generate

      - name: Compute hosted report URL
        if: always() && hashFiles('artifacts/allure-report/**') != ''
        id: hosted_report
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            REPORT_PATH="reports/nightly"
          else
            REPORT_PATH="reports/run-${{ github.run_id }}"
          fi

          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${REPORT_PATH}/"
          echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
          echo "report_url=$REPORT_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy hosted Allure report
        if: always() && hashFiles('artifacts/allure-report/**') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./artifacts/allure-report
          destination_dir: ${{ steps.hosted_report.outputs.report_path }}
          keep_files: true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-smoke-artifacts
          if-no-files-found: warn
          path: artifacts/

      - name: Add Allure report link to job summary
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT_URL: ${{ steps.hosted_report.outputs.report_url }}
        with:
          script: |
            const reportUrl = process.env.REPORT_URL;
            const summary = core.summary.addHeading('Allure Report', 2);

            if (reportUrl) {
              summary
                .addRaw('View your report ')
                .addLink('here', reportUrl)
                .addRaw('.');
            } else {
              summary.addRaw('Hosted report was not generated for this run.');
            }

            await summary.write();
